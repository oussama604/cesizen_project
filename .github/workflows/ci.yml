name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: Static application security testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: python -m pip install --user semgrep

      - name: Scan source code with Semgrep
        run: ~/.local/bin/semgrep scan --config p/php --config p/security-audit --error

  code-quality:
    name: SonarCloud code quality
    needs: frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, intl, pdo_sqlite, sqlite3
          coverage: xdebug
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: vite-build
          path: public/build

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Generate test coverage
        run: php artisan test --without-tty --coverage-clover=coverage/clover.xml

      - name: Analyze code with SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Check SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        with:
          pollingTimeoutSec: 300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  php:
    name: PHP tests
    needs: frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, intl, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit Composer dependencies
        run: composer audit --no-interaction

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: vite-build
          path: public/build

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test --without-tty

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Audit production Node dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend assets
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: public/build
          if-no-files-found: error

  docker-security:
    name: Docker image security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: cesizen-project:ci
          load: true

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cesizen-project:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  dast:
    name: Dynamic application security testing
    needs: [php, docker-security]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare ephemeral application environment
        run: |
          cp .env.example .env
          sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')|" .env

      - name: Build and start ephemeral application
        run: |
          docker build --tag cesizen-project:dast .
          APP_IMAGE=cesizen-project:dast DB_ROOT_PASSWORD=dast-root-password docker compose -f docker-compose.prod.yml up -d

      - name: Wait for application
        run: |
          for attempt in {1..30}; do
            status_code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8000/informations || true)
            if [ "$status_code" = '200' ]; then
              exit 0
            fi
            echo "Application returned HTTP $status_code (attempt $attempt/30)."
            sleep 2
          done
          docker compose -f docker-compose.prod.yml logs app mysql
          exit 1

      - name: Scan application with OWASP ZAP
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:8000
          cmd_options: -a
          allow_issue_writing: false
          fail_action: true

      - name: Stop ephemeral application
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v